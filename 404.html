<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B2D42">
<meta name="color-scheme" content="dark light">
<title>Page not found — Agentic Systems</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2B2D42;--surface:#343751;--line:#4A4E6B;--text:#F7F7F9;--text-mid:#C7C9D8;
  --muted:#9598AE;--accent:#E86A92;--teal:#41E2BA;}
@media (prefers-color-scheme: light){
  :root{--bg:#F7F7F9;--surface:#FFFFFF;--line:#D3D4E0;--text:#2B2D42;--text-mid:#494C64;
        --muted:#71748C;--accent:#C74572;--teal:#128A6C;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px;-webkit-font-smoothing:antialiased}
main{max-width:560px;text-align:center}
svg{width:74px;height:74px;display:block;margin:0 auto 26px}
.rule{width:44px;height:3px;background:var(--accent);margin:0 auto 26px;border-radius:2px}
.code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0 0 14px}
p.b{font-size:16px;line-height:1.6;color:var(--text-mid);margin:0 0 30px}
a.btn{display:inline-block;text-decoration:none;font-size:15px;font-weight:500;color:#FFFFFF;
  background:var(--accent);padding:11px 22px;border-radius:5px;border:1px solid var(--accent);
  transition:opacity .15s ease}
a.btn:hover{opacity:.88}
a.btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Agentic systems">
  
  <g stroke="#41E2BA" stroke-width="3.4" stroke-linecap="round">
    <path d="M32 32 L15 16"/>
    <path d="M32 32 L49 16"/>
    <path d="M32 32 L32 52"/>
  </g>
  <circle cx="15" cy="16" r="6" fill="#41E2BA"/>
  <circle cx="49" cy="16" r="6" fill="#41E2BA"/>
  <circle cx="32" cy="52" r="6" fill="#F7E733"/>
  <circle cx="32" cy="32" r="9.5" fill="#E86A92"/>
</svg>
<div class="rule"></div>
<p class="code">Error 404</p>
<h1>No route to that page</h1>
<p class="b">The page you asked for does not exist here. The guide is a single page, so every section is one tab away.</p>
<a class="btn" href="./index.htm">Back to the guide</a>
</main>
</body>
</html>
